<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time4eCommerce | Studio E-commerce Premium</title>
    <meta name="description" content="Specjaliści od PrestaShop. Wdrożenia, optymalizacja i skalowanie e-commerce dla liderów rynku." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              // Apple/Linear style gray scale
              surface: {
                50: '#F5F5F7', // Light gray background
                100: '#E5E5EA', // Border light
                200: '#D1D1D6',
                300: '#C7C7CC',
              },
              brand: {
                500: '#0071E3', // Vibrant Tech Blue
                600: '#0066CC',
                900: '#001F3F', // Deep Navy
              },
              dark: {
                900: '#050505', // Almost Black
                800: '#121212', // Dark Gray
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.04)',
              'premium': '0 20px 40px -10px rgba(0, 0, 0, 0.08)',
              'glow': '0 0 60px rgba(0, 113, 227, 0.2)',
            },
            backgroundImage: {
              'noise': "url('https://grainy-gradients.vercel.app/noise.svg')",
            },
            letterSpacing: {
              tighter: '-0.04em',
              tight: '-0.02em',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #ffffff;
        color: #050505;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "ss01", "ss02", "cv01", "cv02";
      }
      
      /* Noise Texture Overlay - Subtle Grain */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.04em; 
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D1D6;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #86868b;
      }
      
      /* Selection Color */
      ::selection {
        background: #0071E3;
        color: white;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
</head>
  <body>
    <div class="bg-noise"></div>
    <div id="root"></div>
  </body>
</html>
